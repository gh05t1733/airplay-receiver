name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      # Discover what's actually on the runner (don't guess).
      - name: toolchain facts
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -property installationPath
          where.exe cl.exe

      # vcpkg classic mode: install packages before cmake configure.
      # CRITICAL: run from a temp dir (not repo root) so vcpkg doesn't
      # detect vcpkg.json and enter manifest mode, which needs a baseline
      # that doesn't exist in the runner's shallow clone.
      - name: install deps
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install catch2 spdlog openssl:x64-windows

      # Configure: use Ninja (single-config, fast) with the vcpkg toolchain
      # pointing at classic-mode installed packages.
      - name: configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=OFF

      - name: build
        run: cmake --build build --config Release --parallel

      - name: test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with: { name: airplay-receiver-win64, path: build/Release/*.exe }
